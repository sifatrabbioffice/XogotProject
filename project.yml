name: Xogot
options:
  bundleIdPrefix: com.example
targets:
  Xogot:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - XogotApp
      - path: GodotCore
        includes: ["*.h", "*.a", "*.cpp", "*.hpp"]
      - path: Bridge
        includes: ["*.h", "*.m", "*.mm"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xogot
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_LDFLAGS: -ObjC -framework Metal -framework QuartzCore -framework UIKit -framework CoreGraphics
        HEADER_SEARCH_PATHS: GodotCore Bridge
